<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS-SMP | Perfil de Miembro</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-attachment: fixed; background-color: #0d1219; color: #ffffff;
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
        }
        .card {
            background: rgba(22, 32, 45, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 30px 25px; max-width: 480px; width: 100%; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .badge {
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            display: inline-block; margin-bottom: 20px; background: rgba(46, 204, 113, 0.15);
            color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3);
        }
        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 4px; background: linear-gradient(135deg, #2ecc71, #1abc9c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.gamertag { color: #a0aec0; font-size: 1rem; font-weight: 600; margin-bottom: 20px; }
        .avatar-container { width: 120px; height: 120px; margin: 0 auto 20px auto; }
        .avatar-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; border: 3px solid #2ecc71; box-shadow: 0 0 15px rgba(46, 204, 113, 0.3); background: #111827; }
        .info-box { background: rgba(0, 0, 0, 0.3); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; text-align: left; border: 1px solid rgba(255, 255, 255, 0.05); }
        .info-label { color: #718096; font-size: 0.75rem; text-transform: uppercase; font-weight: 600; margin-bottom: 2px; }
        .info-value { font-weight: 600; font-size: 0.95rem; color: #e2e8f0; line-height: 1.4; }
        .highlight { color: #2ecc71; }
        .btn-main {
            width: 100%; background: linear-gradient(135deg, #2ecc71, #27ae60); color: #fff;
            border: none; padding: 14px; border-radius: 12px; font-size: 0.95rem; font-weight: 700;
            cursor: pointer; margin-top: 15px; display: block; text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">📖 Miembro del Servidor</span>

        <div class="avatar-container">
            <img id="p-foto" class="avatar-img" src="" alt="Foto de perfil">
        </div>

        <h1 id="p-nombre">Cargando...</h1>
        <p class="gamertag" id="p-gamertag">@Gamertag</p>

        <div class="info-box">
            <div class="info-label">Rango en el Servidor</div>
            <div class="info-value" id="p-rango">...</div>
        </div>

        <div class="info-box">
            <div class="info-label">Descripción</div>
            <div class="info-value" id="p-desc">...</div>
        </div>

        <div class="info-box">
            <div class="info-label">Experto en</div>
            <div class="info-value highlight" id="p-experto">...</div>
        </div>

        <div class="info-box">
            <div class="info-label">Tiempo Jugando</div>
            <div class="info-value" id="p-tiempo">...</div>
        </div>

        <div class="info-box">
            <div class="info-label">Experiencias Destacadas</div>
            <div class="info-value" id="p-exp">...</div>
        </div>

        <a href="miembros.html" class="btn-main">👥 Volver a Miembros</a>
    </div>

    <script src="datos.js"></script>
    <script>
        function obtenerColorRango(rango) {
            if (!rango) return '#2ecc71';
            const r = rango.toLowerCase();
            if (r.includes('admin')) return '#e74c3c';   // Rojo
            if (r.includes('mod')) return '#e67e22';     // Naranja
            if (r.includes('vip')) return '#f1c40f';     // Dorado
            if (r.includes('builder')) return '#3498db'; // Azul
            return '#2ecc71';                            // Verde (Miembro)
        }

        document.addEventListener("DOMContentLoaded", () => {
            const num = Math.floor(Math.random() * 5) + 1;
            document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('../imgfondo/${num}.jpg')`;

            const urlParams = new URLSearchParams(window.location.search);
            const userId = urlParams.get('user');
            const usuario = listaMiembros.find(m => m.id === userId);

            if (usuario) {
                const rangoTexto = usuario.rango || "🗡️ Miembro";
                const elemRango = document.getElementById('p-rango');

                document.getElementById('p-foto').src = usuario.foto;
                document.getElementById('p-nombre').innerText = usuario.nombreReal;
                document.getElementById('p-gamertag').innerText = usuario.gamertag;
                elemRango.innerText = rangoTexto;
                elemRango.style.color = obtenerColorRango(rangoTexto);
                document.getElementById('p-desc').innerText = usuario.descripcion;
                document.getElementById('p-experto').innerText = usuario.expertoEn;
                document.getElementById('p-tiempo').innerText = usuario.tiempoJuego;
                document.getElementById('p-exp').innerText = usuario.experiencias;
            } else {
                document.getElementById('p-nombre').innerText = "Jugador no encontrado";
            }
        });
    </script>
</body>
</html>
