<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SYS-SMP | Miembros</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body {
            background-size: cover; background-position: center; background-repeat: no-repeat;
            background-attachment: fixed; background-color: #0d1219; color: #ffffff;
            min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px;
            transition: background-image 0.5s ease-in-out;
        }
        .card {
            background: rgba(22, 32, 45, 0.85); backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px;
            padding: 30px 25px; max-width: 480px; width: 100%; text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        .top-nav { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 25px; }
        .nav-btn {
            background: rgba(255, 255, 255, 0.06); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 8px; border-radius: 12px; font-size: 0.82rem; font-weight: 600;
            text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 6px;
            transition: all 0.25s ease;
        }
        .nav-btn:hover { background: rgba(46, 204, 113, 0.2); border-color: #2ecc71; color: #2ecc71; }
        .btn-inicio { grid-column: 1 / -1; background: rgba(46, 204, 113, 0.15); border-color: rgba(46, 204, 113, 0.4); color: #2ecc71; }
        .btn-inicio:hover { background: #2ecc71; color: #000; }
        .badge {
            padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600;
            display: inline-block; margin-bottom: 15px; background: rgba(46, 204, 113, 0.15);
            color: #2ecc71; border: 1px solid rgba(46, 204, 113, 0.3);
        }
        h1 { font-size: 2.2rem; font-weight: 800; margin-bottom: 8px; background: linear-gradient(135deg, #2ecc71, #1abc9c); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #a0aec0; font-size: 0.95rem; margin-bottom: 25px; }
        .players-list { display: flex; flex-direction: column; gap: 15px; }
        .player-card {
            background: rgba(0, 0, 0, 0.3); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px; padding: 15px; display: flex; align-items: center;
            justify-content: space-between; gap: 12px; text-align: left;
        }
        .avatar-img { width: 65px; height: 65px; border-radius: 50%; object-fit: cover; border: 2px solid #2ecc71; background: #111827; flex-shrink: 0; }
        .player-info { flex-grow: 1; }
        .gamertag { font-size: 0.95rem; font-weight: 700; color: #ffffff; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .rank-badge {
            font-size: 0.7rem; font-weight: 700; border-style: solid; border-width: 1px;
            padding: 2px 8px; border-radius: 6px;
        }
        .member-since { font-size: 0.78rem; color: #2ecc71; font-weight: 600; margin-top: 2px; }
        .btn-profile {
            background: rgba(255, 255, 255, 0.08); color: #fff; padding: 8px 12px;
            border-radius: 8px; font-weight: 600; font-size: 0.8rem; text-decoration: none;
            transition: all 0.2s ease;
        }
        .btn-profile:hover { background: #2ecc71; color: #000; }
    </style>
</head>
<body>

    <div class="card">
        <nav class="top-nav">
            <a href="../index.html" class="nav-btn btn-inicio">🏠 Inicio</a>
            <a href="../recuerdos/recuerdos.html" class="nav-btn">📸 Recuerdos</a>
            <a href="../eventos/eventos.html" class="nav-btn">📅 Eventos</a>
            <a href="../ubicaciones/ubicaciones.html" class="nav-btn">📍 Ubicaciones</a>
        </nav>

        <span class="badge">👥 Comunidad SYS-SMP</span>
        <h1>Miembros</h1>
        <p class="subtitle">Lista de integrantes del servidor</p>

        <div class="players-list" id="contenedor-miembros"></div>
    </div>

    <script src="datos.js"></script>
    <script>
        const IMAGEN_FALLBACK = '../imgfondo/default.jpg';

        function obtenerColorRango(rango) {
            if (!rango) return '#2ecc71';
            const r = rango.toLowerCase();
            if (r.includes('admin')) return '#e74c3c';   // Rojo
            if (r.includes('mod')) return '#e67e22';     // Naranja
            if (r.includes('vip')) return '#f1c40f';     // Dorado
            if (r.includes('builder')) return '#3498db'; // Azul
            return '#2ecc71';                            // Verde (Miembro)
        }

        document.addEventListener("DOMContentLoaded", () => {
            // Carga de fondo segura
            const num = Math.floor(Math.random() * 5) + 1;
            const rutaBg = `../imgfondo/${num}.jpg`;

            const imgBgTemp = new Image();
            imgBgTemp.src = rutaBg;

            imgBgTemp.onload = () => {
                document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('${rutaBg}')`;
            };

            imgBgTemp.onerror = () => {
                document.body.style.backgroundImage = `linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('${IMAGEN_FALLBACK}')`;
            };

            const contenedor = document.getElementById("contenedor-miembros");
            if (typeof listaMiembros !== 'undefined' && contenedor) {
                contenedor.innerHTML = listaMiembros.map(m => {
                    const color = obtenerColorRango(m.rango);
                    const fotoAvatar = (m.foto && m.foto.trim() !== '') ? m.foto : IMAGEN_FALLBACK;

                    return `
                        <div class="player-card">
                            <img class="avatar-img" 
                                 src="${fotoAvatar}" 
                                 alt="${m.gamertag}" 
                                 onerror="this.onerror=null; this.src='${IMAGEN_FALLBACK}';">
                            <div class="player-info">
                                <div class="gamertag">
                                    ${m.gamertag}
                                    <span class="rank-badge" style="color: ${color}; border-color: ${color}aa; background: ${color}22;">
                                        ${m.rango || '🗡️ Miembro'}
                                    </span>
                                </div>
                                <div class="member-since">⏳ ${m.tiempoMiembro}</div>
                            </div>
                            <a href="perfil.html?user=${m.id}" class="btn-profile">Perfil</a>
                        </div>
                    `;
                }).join('');
            }
        });
    </script>
</body>
</html>
